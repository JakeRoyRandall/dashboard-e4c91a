name: Update fallback prices
on:
  schedule:
    - cron: '*/15 13-20 * * 1-5' # every 15 min, 9am-4:45pm ET weekdays (market hours + 45m buffer)
    - cron: '5 21 * * 1-5'       # final 4:05pm ET snapshot after close
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yfinance
        run: pip install --quiet yfinance

      - name: Fetch prices and update fallbacks
        run: |
          python3 << 'PYEOF'
          import re, json, urllib.request, http.cookiejar
          import yfinance as yf

          with open('index.html', 'r') as f:
              lines = f.readlines()

          # Parse holdings: find stock symbols (with shares > 0) and option contracts
          stock_lines = {}   # symbol -> line index (only symbols with shares)
          contracts = {}     # symbol -> [(occ, qty)]
          current_sym = None

          for i, line in enumerate(lines):
              m = re.search(r"symbol:'([^']+)'.*?shares:(\d+).*?fp:([\d.]+)", line)
              if m:
                  sym, shares = m.group(1), int(m.group(2))
                  current_sym = sym
                  contracts.setdefault(sym, [])
                  if shares > 0:
                      stock_lines[sym] = i

              for occ, qty in re.findall(r"\{occ:'([^']+)',qty:(\d+)", line):
                  if current_sym:
                      contracts.setdefault(current_sym, []).append((occ, int(qty)))

          # Collect all tickers to fetch (stocks + option contracts)
          tickers = set(stock_lines.keys())
          for cs in contracts.values():
              tickers.update(occ for occ, _ in cs)

          # yfinance handles Yahoo's crumb/auth dance. For options we prefer mid
          # (bid+ask)/2 since last trade is often stale on illiquid contracts;
          # fall back to last price if bid/ask unavailable.
          prices = {}
          option_syms = {occ for cs in contracts.values() for occ, _ in cs}

          for ticker in sorted(option_syms | set(stock_lines.keys())):
              try:
                  info = yf.Ticker(ticker).info
                  bid = info.get("bid") or 0
                  ask = info.get("ask") or 0
                  last = info.get("regularMarketPrice") or 0
                  is_option = ticker in option_syms
                  if is_option and bid > 0 and ask > 0:
                      prices[ticker] = round((bid + ask) / 2, 2)
                      print(f"  {ticker}: {prices[ticker]} (mid; bid={bid} ask={ask} last={last})")
                  elif last > 0:
                      prices[ticker] = round(last, 2)
                      print(f"  {ticker}: {prices[ticker]} (last)")
                  else:
                      print(f"  {ticker}: no price data (bid={bid} ask={ask} last={last})")
              except Exception as e:
                  print(f"  {ticker}: FAILED ({e})")

          changed = False

          # Update fp (stock fallback price) for symbols with shares
          for sym, idx in stock_lines.items():
              if sym not in prices:
                  continue
              old = lines[idx]
              new = re.sub(r"fp:[\d.]+", f"fp:{round(prices[sym], 2)}", old)
              if old != new:
                  lines[idx] = new
                  changed = True

          # Update mark: on each contract line and opt: aggregate on each
          # holding header. The client reads mark: per contract (authoritative);
          # opt: is kept as a fallback aggregate for compat.
          def replace_contract(m):
              occ, qty, rest = m.group(1), m.group(2), m.group(3)
              rest_clean = re.sub(r",mark:[\d.]+", "", rest)
              if occ in prices:
                  return f"{{occ:'{occ}',qty:{qty}{rest_clean},mark:{prices[occ]}}}"
              return m.group(0)

          for i, line in enumerate(lines):
              if "occ:'" not in line: continue
              new = re.sub(r"\{occ:'([^']+)',qty:(\d+)((?:,[a-z]+:[\d.]+)*)\}", replace_contract, line)
              if new != line:
                  lines[i] = new
                  changed = True

          for sym, cs in contracts.items():
              if not cs or not all(prices.get(occ) for occ, _ in cs): continue
              new_opt = int(sum(prices[occ] * 100 * qty for occ, qty in cs))
              for i, line in enumerate(lines):
                  if f"symbol:'{sym}'" in line:
                      new = re.sub(r"opt:\d+", f"opt:{new_opt}", lines[i])
                      if new != lines[i]:
                          lines[i] = new
                          changed = True
                      break

          if changed:
              with open("index.html", "w") as f:
                  f.writelines(lines)
              print("Fallback prices updated.")
          else:
              print("No changes.")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet index.html || (git add index.html && git commit -m "Update fallback prices $(date -u +%Y-%m-%d)" && git push)
