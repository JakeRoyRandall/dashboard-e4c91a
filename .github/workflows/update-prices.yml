name: Update fallback prices
on:
  schedule:
    - cron: '*/15 13-20 * * 1-5' # every 15 min, 9am-4:45pm ET weekdays (market hours + 45m buffer)
    - cron: '5 21 * * 1-5'       # final 4:05pm ET snapshot after close
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices and update fallbacks
        run: |
          python3 << 'PYEOF'
          import os, re, json, urllib.request

          ALPACA_KEY = os.environ["ALPACA_API_KEY"]
          ALPACA_SECRET = os.environ["ALPACA_SECRET_KEY"]
          HDRS = {"APCA-API-KEY-ID": ALPACA_KEY, "APCA-API-SECRET-KEY": ALPACA_SECRET}

          with open("index.html") as f:
              lines = f.readlines()

          stock_lines, contracts = {}, {}
          current = None
          for i, line in enumerate(lines):
              m = re.search(r"symbol:'([^']+)'.*?shares:(\d+).*?fp:([\d.]+)", line)
              if m:
                  sym, shares = m.group(1), int(m.group(2))
                  current = sym
                  contracts.setdefault(sym, [])
                  if shares > 0: stock_lines[sym] = i
              for occ, qty in re.findall(r"\{occ:'([^']+)',qty:(\d+)", line):
                  if current: contracts.setdefault(current, []).append((occ, int(qty)))

          option_syms = sorted({occ for cs in contracts.values() for occ, _ in cs})
          stock_syms = sorted(stock_lines.keys())

          def fetch_json(url):
              req = urllib.request.Request(url, headers=HDRS)
              return json.loads(urllib.request.urlopen(req, timeout=20).read())

          prices = {}

          # Options: Alpaca v1beta1 options quotes (real-time bid/ask)
          if option_syms:
              url = f"https://data.alpaca.markets/v1beta1/options/quotes/latest?symbols={','.join(option_syms)}"
              try:
                  d = fetch_json(url)
                  for sym, q in d.get("quotes", {}).items():
                      bid, ask = q.get("bp") or 0, q.get("ap") or 0
                      if bid > 0 and ask > 0:
                          prices[sym] = round((bid + ask) / 2, 2)
                          print(f"  {sym}: {prices[sym]} (mid; bid={bid} ask={ask})")
                      else:
                          print(f"  {sym}: no bid/ask (bid={bid} ask={ask})")
              except Exception as e:
                  print(f"Options fetch failed: {e}")

          # Stocks: Alpaca v2 stock quotes (real-time bid/ask midpoint)
          if stock_syms:
              url = f"https://data.alpaca.markets/v2/stocks/quotes/latest?symbols={','.join(stock_syms)}"
              try:
                  d = fetch_json(url)
                  for sym, q in d.get("quotes", {}).items():
                      bid, ask = q.get("bp") or 0, q.get("ap") or 0
                      if bid > 0 and ask > 0:
                          prices[sym] = round((bid + ask) / 2, 2)
                          print(f"  {sym}: {prices[sym]} (mid; bid={bid} ask={ask})")
              except Exception as e:
                  print(f"Stocks fetch failed: {e}")

          changed = False

          # Update fp: (stock fallback) for symbols with shares
          for sym, idx in stock_lines.items():
              if sym not in prices: continue
              new = re.sub(r"fp:[\d.]+", f"fp:{prices[sym]}", lines[idx])
              if new != lines[idx]:
                  lines[idx] = new; changed = True

          # Update mark: on each contract
          def replace_contract(m):
              occ, qty, rest = m.group(1), m.group(2), m.group(3)
              rest_clean = re.sub(r",mark:[\d.]+", "", rest)
              if occ in prices:
                  return f"{{occ:'{occ}',qty:{qty}{rest_clean},mark:{prices[occ]}}}"
              return m.group(0)

          for i, line in enumerate(lines):
              if "occ:'" not in line: continue
              new = re.sub(r"\{occ:'([^']+)',qty:(\d+)((?:,[a-z]+:[\d.]+)*)\}", replace_contract, line)
              if new != line:
                  lines[i] = new; changed = True

          # Update opt: aggregate per holding
          for sym, cs in contracts.items():
              if not cs or not all(prices.get(occ) for occ, _ in cs): continue
              new_opt = int(sum(prices[occ] * 100 * qty for occ, qty in cs))
              for i, line in enumerate(lines):
                  if f"symbol:'{sym}'" in line:
                      new = re.sub(r"opt:\d+", f"opt:{new_opt}", lines[i])
                      if new != lines[i]:
                          lines[i] = new; changed = True
                      break

          if changed:
              with open("index.html", "w") as f: f.writelines(lines)
              print("Updated.")
          else:
              print("No changes.")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet index.html || (git add index.html && git commit -m "Update fallback prices $(date -u +%Y-%m-%d)" && git push)
