name: Update fallback prices
on:
  schedule:
    - cron: '*/15 13-20 * * 1-5' # every 15 min, 9am-4:45pm ET weekdays (market hours + 45m buffer)
    - cron: '5 21 * * 1-5'       # final 4:05pm ET snapshot after close
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices and update fallbacks
        run: |
          python3 << 'PYEOF'
          import re, json, urllib.request, http.cookiejar

          with open('index.html', 'r') as f:
              lines = f.readlines()

          # Parse holdings: find stock symbols (with shares > 0) and option contracts
          stock_lines = {}   # symbol -> line index (only symbols with shares)
          contracts = {}     # symbol -> [(occ, qty)]
          current_sym = None

          for i, line in enumerate(lines):
              m = re.search(r"symbol:'([^']+)'.*?shares:(\d+).*?fp:([\d.]+)", line)
              if m:
                  sym, shares = m.group(1), int(m.group(2))
                  current_sym = sym
                  contracts.setdefault(sym, [])
                  if shares > 0:
                      stock_lines[sym] = i

              for occ, qty in re.findall(r"\{occ:'([^']+)',qty:(\d+)", line):
                  if current_sym:
                      contracts.setdefault(current_sym, []).append((occ, int(qty)))

          # Collect all tickers to fetch (stocks + option contracts)
          tickers = set(stock_lines.keys())
          for cs in contracts.values():
              tickers.update(occ for occ, _ in cs)

          # Fetch from Yahoo Finance via v7 quote endpoint (gives bid/ask; uses mid).
          # For illiquid options, last trade can be hours/days stale, so mid is more accurate.
          prices = {}
          UA = "Mozilla/5.0"
          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          opener.addheaders = [("User-Agent", UA)]
          crumb = ""
          for seed in ["https://finance.yahoo.com/quote/AAPL", "https://finance.yahoo.com", "https://login.yahoo.com"]:
              try:
                  opener.open(seed, timeout=15).read()
              except Exception as e:
                  print(f"Cookie seed {seed} failed: {e}")
                  continue
              try:
                  crumb = opener.open("https://query1.finance.yahoo.com/v1/test/getcrumb", timeout=15).read().decode().strip()
                  if crumb and "<" not in crumb:
                      print(f"Got crumb via {seed}")
                      break
              except Exception as e:
                  print(f"Crumb via {seed} failed: {e}")
          if not crumb:
              print("No crumb obtained; v7 will fail and script will fall back to v8 (last trade)")

          def fetch_quotes(symbols):
              if not symbols: return {}
              url = f"https://query1.finance.yahoo.com/v7/finance/quote?symbols={','.join(symbols)}&crumb={crumb}"
              try:
                  d = json.loads(opener.open(url, timeout=20).read())
                  return {q["symbol"]: q for q in d.get("quoteResponse", {}).get("result", [])}
              except Exception as e:
                  print(f"v7 quote failed: {e}")
                  return {}

          option_syms = {occ for cs in contracts.values() for occ, _ in cs}
          stock_syms = set(stock_lines.keys())
          all_syms = sorted(option_syms | stock_syms)

          # Yahoo caps batch size; chunk to 50
          quotes = {}
          for i in range(0, len(all_syms), 50):
              quotes.update(fetch_quotes(all_syms[i:i+50]))

          for ticker in all_syms:
              q = quotes.get(ticker)
              if not q:
                  # Fallback to v8 chart if v7 missing this symbol
                  try:
                      url = f"https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?interval=1d&range=1d"
                      req = urllib.request.Request(url, headers={"User-Agent": UA})
                      d = json.loads(urllib.request.urlopen(req, timeout=15).read())
                      prices[ticker] = d["chart"]["result"][0]["meta"]["regularMarketPrice"]
                      print(f"  {ticker}: {prices[ticker]} (v8 last)")
                  except Exception as e:
                      print(f"  {ticker}: FAILED ({e})")
                  continue
              bid, ask = q.get("bid"), q.get("ask")
              last = q.get("regularMarketPrice")
              is_option = q.get("quoteType") == "OPTION"
              # Prefer mid for options (bid/ask more current than last trade on illiquid contracts)
              if is_option and bid and ask and bid > 0 and ask > 0:
                  prices[ticker] = round((bid + ask) / 2, 2)
                  print(f"  {ticker}: {prices[ticker]} (mid; bid={bid} ask={ask} last={last})")
              elif last:
                  prices[ticker] = last
                  print(f"  {ticker}: {last} (last)")
              else:
                  print(f"  {ticker}: no price data")

          changed = False

          # Update fp (stock fallback price) for symbols with shares
          for sym, idx in stock_lines.items():
              if sym not in prices:
                  continue
              old = lines[idx]
              new = re.sub(r"fp:[\d.]+", f"fp:{round(prices[sym], 2)}", old)
              if old != new:
                  lines[idx] = new
                  changed = True

          # Update opt (option fallback total) for symbols with contracts
          for sym, cs in contracts.items():
              if not cs:
                  continue
              if not all(prices.get(occ) for occ, _ in cs):
                  continue
              new_opt = int(sum(prices[occ] * 100 * qty for occ, qty in cs))
              for i, line in enumerate(lines):
                  if f"symbol:'{sym}'" in line:
                      old = lines[i]
                      new = re.sub(r"opt:\d+", f"opt:{new_opt}", old)
                      if old != new:
                          lines[i] = new
                          changed = True
                      break

          if changed:
              with open("index.html", "w") as f:
                  f.writelines(lines)
              print("Fallback prices updated.")
          else:
              print("No changes.")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet index.html || (git add index.html && git commit -m "Update fallback prices $(date -u +%Y-%m-%d)" && git push)
